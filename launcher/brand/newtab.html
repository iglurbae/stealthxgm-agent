<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tab Baru</title>
<link rel="stylesheet" href="newtab.css">
</head>
<body>
<!-- ===== icon set: gradient glyphs, depth via tiles in CSS ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<linearGradient id="gGlyph" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfd9f2"/>
</linearGradient>
<linearGradient id="gLogo" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f2617c"/><stop offset="1" stop-color="#c22750"/>
</linearGradient>
<linearGradient id="gLogo2" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#7fb0ff"/><stop offset="1" stop-color="#4f8cff"/>
</linearGradient>
</defs>
<symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="url(#gGlyph)" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></g></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><g fill="none" stroke="url(#gGlyph)" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.4-3.6 4.2-5.4 7.5-5.4s6.1 1.8 7.5 5.4"/></g></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><g fill="none" stroke="url(#gGlyph)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.3 3.9 5.2 3.9 8.5s-1.3 6.2-3.9 8.5c-2.6-2.3-3.9-5.2-3.9-8.5S9.4 5.8 12 3.5z"/></g></symbol>
<symbol id="i-monitor" viewBox="0 0 24 24"><g fill="none" stroke="url(#gGlyph)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="12.5" rx="2"/><path d="M9 20.5h6M12 17v3.5"/></g></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><g fill="none" stroke="url(#gGlyph)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 2.8v5.4c0 4.6-3.2 7.9-7.5 9.8-4.3-1.9-7.5-5.2-7.5-9.8V5.8z"/></g></symbol>
<symbol id="i-shieldcheck" viewBox="0 0 24 24"><g fill="none" stroke="url(#gGlyph)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 2.8v5.4c0 4.6-3.2 7.9-7.5 9.8-4.3-1.9-7.5-5.2-7.5-9.8V5.8z"/><path d="M9 11.8l2.2 2.2 4-4.2"/></g></symbol>
<symbol id="i-code" viewBox="0 0 24 24"><g fill="none" stroke="url(#gGlyph)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5"/></g></symbol>
<symbol id="i-rocket" viewBox="0 0 24 24"><g fill="none" stroke="url(#gGlyph)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5c-1.8-1-3-2.6-3.4-4.7L5 7l3.7-3.7L12.5 7c2.1.4 3.7 1.6 4.7 3.4 1.2 2.1 1.1 4.9-.3 7.3l-2.6-2.6"/><circle cx="14.5" cy="9.5" r="1.6"/><path d="M6.5 14.5c-1.5 1-2.3 2.6-2.5 5 2.4-.2 4-1 5-2.5M14.3 17.7l-2.6-2.6"/></g></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="url(#gGlyph)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.14-1.4l2-1.55-2-3.46-2.36.95a7 7 0 0 0-2.42-1.4L13.7 2.6h-3.4l-.38 2.54a7 7 0 0 0-2.42 1.4l-2.36-.95-2 3.46 2 1.55a7 7 0 0 0 0 2.8l-2 1.55 2 3.46 2.36-.95a7 7 0 0 0 2.42 1.4l.38 2.54h3.4l.38-2.54a7 7 0 0 0 2.42-1.4l2.36.95 2-3.46-2-1.55c.1-.46.14-.93.14-1.4z"/></g></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.8l5 5L19.5 7" fill="none" stroke="url(#gGlyph)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<header>
  <div class="brand">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3l16 6v11.5C40 31 32.6 38.4 24 43 15.4 38.4 8 31 8 20.5V9z" fill="url(#gLogo)"/><path d="M24 3l16 6v4l-16-6-16 6v-4z" fill="#ffffff" opacity=".22"/><path d="M24 8.5l11.5 4.3v7.6c0 8-5.4 13.9-11.5 17.2-6.1-3.3-11.5-9.2-11.5-17.2v-7.6z" fill="url(#gLogo2)" opacity=".9"/><path d="M17.5 17.5l13 13M30.5 17.5l-13 13" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/></svg>
    <span class="word">StealthXGM</span>
  </div>
  <div class="hact">
    <div class="chip"><svg><use href="#i-user"/></svg><span id="chip-name">Profil</span></div>
    <button class="icobtn" id="theme-btn" title="Mode terang / gelap"><svg><use href="#i-gear"/></svg></button>
  </div>
</header>

<main>
  <div class="clock"><div id="time">--:--</div><div id="date">&nbsp;</div></div>

  <form class="search" id="search-form" autocomplete="off">
    <svg><use href="#i-search"/></svg>
    <input id="q" type="text" placeholder="Cari di Google" aria-label="Cari">
    <div class="eng">
      <button type="button" data-e="google" class="on" title="Google">G</button>
      <button type="button" data-e="ddg" title="DuckDuckGo">D</button>
    </div>
    <button class="go" type="submit" title="Cari"><svg><use href="#i-rocket"/></svg></button>
  </form>

  <div class="cards">
    <section class="card">
      <h2><svg><use href="#i-user"/></svg>Profil</h2>
      <div id="profile"><div class="prow"><span class="k">Memuat&hellip;</span></div></div>
    </section>
    <section class="card">
      <h2><svg><use href="#i-monitor"/></svg>Perangkat</h2>
      <div id="fp"><div class="prow"><span class="k">Memuat&hellip;</span></div></div>
    </section>
  </div>

  <div class="links">
    <a href="https://www.google.com"><span class="tile t-blue"><svg><use href="#i-search"/></svg></span>Google</a>
    <a href="https://github.com"><span class="tile t-slate"><svg><use href="#i-code"/></svg></span>GitHub</a>
    <a href="https://www.whatismyipaddress.com/"><span class="tile t-teal"><svg><use href="#i-globe"/></svg></span>Cek IP</a>
    <a href="https://browserleaks.com/javascript"><span class="tile t-violet"><svg><use href="#i-shieldcheck"/></svg></span>Uji Tampilan</a>
  </div>
</main>

<footer>StealthXGM</footer>
<script src="newtab.js"></script>
</body>
</html>
