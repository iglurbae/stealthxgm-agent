<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- F11 (2026-11-08) EXPERIMENT — fontconfig untuk proses browser StealthXGM
     dengan identitas Windows.

     Tujuan: fontconfig sistem (Linux) mengekspos ~1.900 font Noto/DejaVu/
     Liberation/dll ke browser. browserleaks /fonts mengukur 229 font
     terdeteksi, 199 di antaranya keluarga Linux/Noto — tell instan bahwa
     mesin ini Linux padahal identitas mengklaim Windows. Config ini
     menyembunyikan font-file Linux-only dari proses browser, sehingga
     yang dirender hanyalah font yang (a) terinstal sebagai font Windows
     asli (msttcorefonts) atau (b) metric-compatible-nya (crosextra
     Carlito/Caladea) — persis set font yang dimiliki mesin Windows.

     Yang DISEMBUNYIKAN (glob file):
       noto/* (1.812 file incl. Noto Color Emoji), dejavu/*, droid/*,
       liberation/*, libreoffice/*, lyx/*, opentype/noto/*,
       opentype/urw-base35/*, X11/*, type1/*.
     Yang TETAP TERLIHAT:
       truetype/msttcorefonts/* (Arial, Times New Roman, Courier New,
       Verdana, Georgia, Trebuchet MS, Tahoma, Impact, Comic Sans MS,
       Arial Black, Andale Mono, Webdings — asli Microsoft),
       truetype/crosextra/* (Carlito=Calibri, Caladea=Cambria).

     Trade-off yang DIKETAHUI (bukan disembunyikan):
       - CJK (Cina/Jepang/Korea) dan emoji TIDAK punya font lagi di proses
         browser -> render sebagai kotak tofu. Mesin Windows asli punya
         MS Gothic/Meiryo/Yu Gothic + Segoe UI Emoji; font-file itu TIDAK
         tersedia gratis, jadi tidak ada pengganti nyata. Ini harga yang
         dibayar agar daftar font terlihat seperti Windows.
       - Generic sans-serif/serif/monospace jatuh ke Arial/Times/Courier
         (perilaku Windows), bukan DejaVu/Liberation.

     Pemakaian: set env FONTCONFIG_FILE ke path file ini SEBELUM launch
     browser (launcher.py, di samping blok LANG/LC_ALL/TZ). Hanya berlaku
     untuk proses browser itu; font sistem di luar browser tidak berubah.
     JANGAN set secara global — akan merusak rendering aplikasi lain.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/noto/*</glob>
      <glob>/usr/share/fonts/truetype/dejavu/*</glob>
      <glob>/usr/share/fonts/truetype/droid/*</glob>
      <glob>/usr/share/fonts/truetype/liberation/*</glob>
      <glob>/usr/share/fonts/truetype/libreoffice/*</glob>
      <glob>/usr/share/fonts/truetype/lyx/*</glob>
      <glob>/usr/share/fonts/opentype/noto/*</glob>
      <glob>/usr/share/fonts/opentype/urw-base35/*</glob>
      <glob>/usr/share/fonts/X11/*</glob>
      <glob>/usr/share/fonts/type1/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
